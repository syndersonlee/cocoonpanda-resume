<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="100%" font-family="Pretendard, -apple-system, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif" style="max-width:820px;background:#fff"><defs><marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2A41"/></marker><marker id="arr-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E7AC4"/></marker><marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A97A8"/></marker><marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B4FD0"/></marker><marker id="arr-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3BA776"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9534F"/></marker></defs><rect width="820" height="340" fill="#ffffff"/><rect x="10" y="10" width="395" height="320" rx="10" fill="#FBE9E8" stroke="#D9534F" stroke-width="1.5" stroke-dasharray="8 5"/>
<text x="22" y="31" text-anchor="start" font-size="13" font-weight="700" fill="#D9534F">Before · 유형마다 요금제 코드에 분기</text>
<rect x="415" y="10" width="395" height="320" rx="10" fill="#E8F6EF" stroke="#3BA776" stroke-width="1.5" stroke-dasharray="8 5"/>
<text x="427" y="31" text-anchor="start" font-size="13" font-weight="700" fill="#3BA776">After · 조합 규칙을 데이터로 분리</text>
<rect x="30" y="46" width="355" height="222" rx="7" fill="#FFFFFF" stroke="#8A97A8" stroke-width="1.4" opacity="1.0"/>
<text x="207" y="74" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1B2A41">요금제 생성</text>
<text x="56" y="112" text-anchor="start" font-size="13" font-weight="500" fill="#1B2A41">if MEMBERSHIP → …</text>
<text x="56" y="150" text-anchor="start" font-size="13" font-weight="500" fill="#1B2A41">if 기간 할인 → …</text>
<text x="56" y="188" text-anchor="start" font-size="13" font-weight="500" fill="#1B2A41">if 상품 연계 → …</text>
<text x="56" y="226" text-anchor="start" font-size="13" font-weight="600" fill="#D9534F">if 새 유형 → 코드 추가</text>
<text x="207" y="300" text-anchor="middle" font-size="13" font-weight="600" fill="#D9534F">유형이 늘 때마다 요금제 코드 수정·기존 기능 재검증</text>
<rect x="430" y="46" width="180" height="60" rx="7" fill="#FFFFFF" stroke="#4FA3E0" stroke-width="1.4"/>
<text x="520.0" y="73.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1B2A41">프로모션 정의</text>
<text x="520.0" y="93.5" text-anchor="middle" font-size="12" fill="#6B7A90">(유형·그룹·자격 정책)</text>
<rect x="620" y="46" width="175" height="60" rx="7" fill="#FFFFFF" stroke="#4FA3E0" stroke-width="1.4"/>
<text x="707.5" y="73.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1B2A41">중첩 규칙</text>
<text x="707.5" y="93.5" text-anchor="middle" font-size="12" fill="#6B7A90">(타입 그룹 데이터)</text>
<path d="M 520 106 L 575 138" fill="none" stroke="#3BA776" stroke-width="1.6" marker-end="url(#arr-good)"/>
<path d="M 707 106 L 652 138" fill="none" stroke="#3BA776" stroke-width="1.6" marker-end="url(#arr-good)"/>
<rect x="465" y="140" width="295" height="56" rx="7" fill="#FFFFFF" stroke="#4FA3E0" stroke-width="1.4"/>
<text x="612.5" y="165.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1B2A41">프로모션 그룹 생성</text>
<text x="612.5" y="185.5" text-anchor="middle" font-size="12" fill="#6B7A90">(조합 탐색 + 규칙 판정)</text>
<path d="M 612 196 L 612 222" fill="none" stroke="#3BA776" stroke-width="1.6" marker-end="url(#arr-good)"/>
<rect x="465" y="224" width="295" height="50" rx="7" fill="#FFFFFF" stroke="#3BA776" stroke-width="1.4"/>
<text x="612.5" y="246.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1B2A41">요금제 생성</text>
<text x="612.5" y="266.5" text-anchor="middle" font-size="12" fill="#6B7A90">(프로모션 그룹만 앎)</text>
<text x="612" y="300" text-anchor="middle" font-size="13" font-weight="600" fill="#3BA776">새 유형 = 정의·그룹 데이터 추가, 요금제 코드 그대로</text></svg>