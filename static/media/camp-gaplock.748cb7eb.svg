<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 498" width="100%" font-family="Pretendard, -apple-system, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif" style="max-width:820px;background:#fff"><defs><marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2A41"/></marker><marker id="arr-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E7AC4"/></marker><marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A97A8"/></marker><marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B4FD0"/></marker><marker id="arr-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3BA776"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9534F"/></marker></defs><rect width="820" height="498" fill="#ffffff"/><rect x="16" y="16" width="470" height="414" rx="10" fill="#FFFFFF" stroke="#D9534F" stroke-width="1.5" stroke-dasharray="8 5"/>
<text x="28" y="36" font-size="12.5" font-weight="700" fill="#0E7AC4">Before · 전체 삭제 후 재삽입</text>
<rect x="30.0" y="44" width="100" height="36" rx="7" fill="#F1F8FE" stroke="#4FA3E0" stroke-width="1.4"/>
<text x="80.0" y="66.8" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1B2A41">동기화 A</text>
<path d="M80,80 V366" fill="none" stroke="#8A97A8" stroke-width="1.2" stroke-dasharray="6 4"/>
<rect x="170.0" y="44" width="160" height="36" rx="7" fill="#F1F8FE" stroke="#4FA3E0" stroke-width="1.4"/>
<text x="250.0" y="66.8" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1B2A41">MySQL (보조 인덱스)</text>
<path d="M250,80 V366" fill="none" stroke="#8A97A8" stroke-width="1.2" stroke-dasharray="6 4"/>
<rect x="370.0" y="44" width="100" height="36" rx="7" fill="#F1F8FE" stroke="#4FA3E0" stroke-width="1.4"/>
<text x="420.0" y="66.8" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1B2A41">동기화 B</text>
<path d="M420,80 V366" fill="none" stroke="#8A97A8" stroke-width="1.2" stroke-dasharray="6 4"/>
<path d="M80,130 H244" fill="none" stroke="#1B2A41" stroke-width="1.6" marker-end="url(#arr-ink)"/>
<rect x="116.8" y="93" width="96.4" height="19" rx="3" fill="#FFFFFF" opacity="0.95"/>
<text x="165.0" y="106" text-anchor="middle" font-size="12" font-weight="500" fill="#1B2A41">DELETE WHERE</text>
<rect x="100.0" y="109" width="130.0" height="19" rx="3" fill="#FFFFFF" opacity="0.95"/>
<text x="165.0" y="122" text-anchor="middle" font-size="12" font-weight="500" fill="#1B2A41">재고 id = … (0건)</text>
<path d="M420,190 H256" fill="none" stroke="#1B2A41" stroke-width="1.6" marker-end="url(#arr-ink)"/>
<rect x="286.8" y="153" width="96.4" height="19" rx="3" fill="#FFFFFF" opacity="0.95"/>
<text x="335.0" y="166" text-anchor="middle" font-size="12" font-weight="500" fill="#1B2A41">DELETE WHERE</text>
<rect x="270.0" y="169" width="130.0" height="19" rx="3" fill="#FFFFFF" opacity="0.95"/>
<text x="335.0" y="182" text-anchor="middle" font-size="12" font-weight="500" fill="#1B2A41">재고 id = … (0건)</text>
<rect x="150" y="206" width="200" height="34" rx="6" fill="#FFF4E3" stroke="#E8A33D" stroke-width="1.4"/>
<text x="250" y="228" text-anchor="middle" font-size="12" font-weight="600" fill="#1B2A41">같은 구간 Gap Lock (서로 호환)</text>
<path d="M80,290 H244" fill="none" stroke="#D9534F" stroke-width="1.6" marker-end="url(#arr-red)"/>
<rect x="128.8" y="253" width="72.4" height="19" rx="3" fill="#FFFFFF" opacity="0.95"/>
<text x="165.0" y="266" text-anchor="middle" font-size="12" font-weight="500" fill="#D9534F">INSERT →</text>
<rect x="96.4" y="269" width="137.2" height="19" rx="3" fill="#FFFFFF" opacity="0.95"/>
<text x="165.0" y="282" text-anchor="middle" font-size="12" font-weight="500" fill="#D9534F">B의 Gap Lock에 막힘</text>
<path d="M420,350 H256" fill="none" stroke="#D9534F" stroke-width="1.6" marker-end="url(#arr-red)"/>
<rect x="298.8" y="313" width="72.4" height="19" rx="3" fill="#FFFFFF" opacity="0.95"/>
<text x="335.0" y="326" text-anchor="middle" font-size="12" font-weight="500" fill="#D9534F">INSERT →</text>
<rect x="266.4" y="329" width="137.2" height="19" rx="3" fill="#FFFFFF" opacity="0.95"/>
<text x="335.0" y="342" text-anchor="middle" font-size="12" font-weight="500" fill="#D9534F">A의 Gap Lock에 막힘</text>
<rect x="30" y="374" width="442" height="42" rx="6" fill="#FBE9E8" stroke="#D9534F" stroke-width="1.4"/>
<text x="251" y="400" text-anchor="middle" font-size="13" font-weight="700" fill="#D9534F">Deadlock → 한쪽 롤백 → 재고만 반영, 일정 누락</text>
<rect x="500" y="16" width="304" height="414" rx="10" fill="#FFFFFF" stroke="#3BA776" stroke-width="1.5" stroke-dasharray="8 5"/>
<text x="512" y="36" font-size="12.5" font-weight="700" fill="#0E7AC4">After · 변경분만 반영</text>
<rect x="514" y="44" width="276" height="50" rx="7" fill="#FFFFFF" stroke="#4FA3E0" stroke-width="1.4"/>
<text x="652.0" y="66.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1B2A41">① 기존 일정 조회</text>
<text x="652.0" y="86.5" text-anchor="middle" font-size="12" fill="#6B7A90">→ (오픈, 마감) 키 집합</text>
<path d="M652,94 V106" fill="none" stroke="#1B2A41" stroke-width="1.6" marker-end="url(#arr-ink)"/>
<rect x="514" y="108" width="276" height="50" rx="7" fill="#FFFFFF" stroke="#4FA3E0" stroke-width="1.4"/>
<text x="652.0" y="130.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1B2A41">② 목표와 비교</text>
<text x="652.0" y="150.5" text-anchor="middle" font-size="12" fill="#6B7A90">→ 제거 대상 / 신규 대상</text>
<path d="M652,158 V170" fill="none" stroke="#1B2A41" stroke-width="1.6" marker-end="url(#arr-ink)"/>
<rect x="514" y="172" width="276" height="50" rx="7" fill="#FFFFFF" stroke="#4FA3E0" stroke-width="1.4"/>
<text x="652.0" y="194.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1B2A41">③ 제거 대상 있을 때만 DELETE</text>
<text x="652.0" y="214.5" text-anchor="middle" font-size="12" fill="#6B7A90">WHERE id IN (…) (PK)</text>
<path d="M652,222 V234" fill="none" stroke="#1B2A41" stroke-width="1.6" marker-end="url(#arr-ink)"/>
<rect x="514" y="236" width="276" height="40" rx="7" fill="#FFFFFF" stroke="#4FA3E0" stroke-width="1.4"/>
<text x="652.0" y="260.8" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1B2A41">④ 신규 대상만 INSERT</text>
<path d="M652,276 V288" fill="none" stroke="#1B2A41" stroke-width="1.6" marker-end="url(#arr-ink)"/>
<rect x="514" y="290" width="276" height="50" rx="7" fill="#FFFFFF" stroke="#4FA3E0" stroke-width="1.4"/>
<text x="652.0" y="312.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1B2A41">⑤ 변경 없으면</text>
<text x="652.0" y="332.5" text-anchor="middle" font-size="12" fill="#6B7A90">아무 쿼리도 실행하지 않음</text>
<rect x="514" y="356" width="276" height="58" rx="6" fill="#E8F6EF" stroke="#3BA776" stroke-width="1.4"/>
<text x="652" y="380" text-anchor="middle" font-size="13" font-weight="700" fill="#3BA776">Lock 범위 = 실제 변경 행(PK)</text>
<text x="652" y="400" text-anchor="middle" font-size="13" font-weight="700" fill="#3BA776">→ Deadlock 제거</text>
<rect x="16" y="444" width="788" height="38" rx="6" fill="#FFF4E3" stroke="#E8A33D" stroke-width="1.4"/>
<text x="410" y="468" text-anchor="middle" font-size="13" font-weight="600" fill="#1B2A41">REPEATABLE READ에서는 매칭 0건인 보조 인덱스 DELETE도 그 값이 들어갈 구간을 잠급니다</text></svg>